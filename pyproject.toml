[project]
name = "odoo-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Odoo cloud apps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.30.0,<2",
    "odoorpc>=0.10.1",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
odoo-mcp = "odoo_mcp.server:cli"
odoo-mcp-http = "odoo_mcp.http:main"

[project.optional-dependencies]
http = ["fastmcp==3.4.11", "mcp==1.30.0"]
test = ["pytest>=9.1.1,<10", "httpx>=0.28.1,<1"]
